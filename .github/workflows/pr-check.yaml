name: PR Approval Check

on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  check-approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Check for PR approvals
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request 
              ? context.payload.pull_request.number 
              : context.issue.number;
            
            if (!prNumber) {
              core.setFailed("PR number not found.");
              return;
            }

            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;

            const prDetails = await github.rest.pullRequests.get({
              owner: repoOwner,
              repo: repoName,
              pull_number: prNumber,
            });
            const prAuthor = prDetails.data.user.login;

            const reviews = await github.paginate(github.rest.pullRequests.listReviews, {
              owner: repoOwner,
              repo: repoName,
              pull_number: prNumber,
            });

            const latestReviews = {};
            
            for (const review of reviews) {
              if (review.user) {
                latestReviews[review.user.login] = review.state;
              }
            }

            const validApprovers = Object.keys(latestReviews).filter(reviewer => {
              return reviewer !== prAuthor && latestReviews[reviewer] === 'APPROVED';
            });

            console.log(`PR Author: ${prAuthor}`);
            console.log(`Valid Approvers: ${validApprovers.join(', ') || 'None'}`);

            if (validApprovers.length < 1) {
              core.setFailed("Merge denied: At least one approval from another user is required.");
            } else {
              core.info("Merge allowed: Approval criteria met.");
            }
